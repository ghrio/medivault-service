version: "2"
sql:
  - engine: "postgresql"
    schema: "internal/db/schema/schema.sql" # Path to schema file
    queries: "internal/db/queries/" # Path to SQL queries
    gen:
      go:
        emit_json_tags: true
        package: "generated" # Package name for generated code
        out: "internal/db/generated" # Output directory
        sql_package: "pgx/v5" # Use pgx for database connection
