version: "3.9"
services:
  db:
    image: postgres:16
    container_name: postgres_container
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: go_app
    depends_on:
      - db
    environment:
      DB_SOURCE: "postgresql://user:password@db:5432/mydb?sslmode=disable"
    ports:
      - "8080:8080"

volumes:
  postgres_data:
